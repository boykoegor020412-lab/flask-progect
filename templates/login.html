<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="../static/remove.css?v=1">
    <link rel="stylesheet" href="../static/style.css?v=1">
</head>
<body class="body">
    <a href="/" class="user_page_a">На главную</a>
    <div class="main_line"></div>
    <div class="login">
        <h1 class="login_h1">Вход</h1>
        <form method="post" class="login__form">
            <div class="login__form_informations">
                <div class="login__form_information">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" required placeholder="email">
                </div>
                <div class="login__form_information">
                    <label for="password">Password:</label>
                    <input type="password" name="password" id="password" required placeholder="password">
                </div>
                <div class="login__form_informationCheckbox">
                    <label for="remember">Запомнить:</label>
                    <input type="checkbox" name="remember" id="remember" class="login__form_input-checkbox">
                </div>
                
            </div> 
            <button type="submit">Войти</button>
        </form>

    </div>
</body>
</html>
